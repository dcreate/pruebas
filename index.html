<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Gatita Mágica 🐱💕</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- Fondo decorativo -->
    <div class="background-decorations">
        <span class="star star-1">✦</span>
        <span class="star star-2">✧</span>
        <span class="star star-3">✦</span>
        <span class="star star-4">✧</span>
        <span class="star star-5">✦</span>

        <span class="heart heart-1">♥</span>
        <span class="heart heart-2">♡</span>
        <span class="heart heart-3">♥</span>
        <span class="heart heart-4">♡</span>
    </div>

    <!-- Contenido principal -->
    <main class="container">

        <div class="magic-label">
            ✨ Un mundo lleno de magia ✨
        </div>

        <!-- Personaje -->
        <div class="character-area">

            <!-- Burbuja de diálogo -->
            <div class="speech-bubble" id="speechBubble">
                ¡Hola, princesa! 💕
            </div>

            <!-- Gatita -->
            <div class="cat" id="cat" role="button"
                 tabindex="0"
                 aria-label="Toca a la gatita para saludar">

                <!-- Cola -->
                <div class="tail">
                    <div class="tail-tip"></div>
                </div>

                <!-- Cuerpo -->
                <div class="body">

                    <!-- Sudadera -->
                    <div class="hoodie">

                        <div class="hoodie-neck"></div>

                        <div class="hoodie-heart">♥</div>

                        <div class="hoodie-pocket"></div>

                        <div class="hoodie-string string-left"></div>
                        <div class="hoodie-string string-right"></div>

                    </div>

                    <!-- Patitas inferiores -->
                    <div class="leg leg-left"></div>
                    <div class="leg leg-right"></div>

                </div>

                <!-- Cabeza -->
                <div class="head">

                    <!-- Orejas -->
                    <div class="ear ear-left">
                        <div class="ear-inner"></div>
                    </div>

                    <div class="ear ear-right">
                        <div class="ear-inner"></div>
                    </div>

                    <!-- Cara -->
                    <div class="face">

                        <!-- Rayas de la cabeza -->
                        <div class="head-stripe stripe-left"></div>
                        <div class="head-stripe stripe-center"></div>
                        <div class="head-stripe stripe-right"></div>

                        <!-- Ojos -->
                        <div class="eye eye-left">
                            <div class="eye-shine"></div>
                        </div>

                        <div class="eye eye-right">
                            <div class="eye-shine"></div>
                        </div>

                        <!-- Pestañas -->
                        <div class="eyelashes eyelashes-left">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="eyelashes eyelashes-right">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <!-- Mejillas -->
                        <div class="cheek cheek-left"></div>
                        <div class="cheek cheek-right"></div>

                        <!-- Hocico -->
                        <div class="muzzle muzzle-left"></div>
                        <div class="muzzle muzzle-right"></div>

                        <!-- Nariz -->
                        <div class="nose"></div>

                        <!-- Boca -->
                        <div class="mouth">
                            <span class="mouth-left"></span>
                            <span class="mouth-right"></span>
                        </div>

                        <!-- Bigotes -->
                        <div class="whiskers whiskers-left">
                            <span></span>
                            <span></span>
                        </div>

                        <div class="whiskers whiskers-right">
                            <span></span>
                            <span></span>
                        </div>

                    </div>

                    <!-- Moño rosa -->
                    <div class="bow">
                        <div class="bow-loop bow-loop-left"></div>
                        <div class="bow-loop bow-loop-right"></div>
                        <div class="bow-center"></div>
                    </div>

                </div>

                <!-- Brazo que saluda -->
                <div class="arm arm-left">
                    <div class="paw paw-left"></div>
                    <span class="paw-pad"></span>
                </div>

                <!-- Brazo derecho -->
                <div class="arm arm-right">
                    <div class="paw paw-right"></div>
                </div>

                <!-- Brillo decorativo -->
                <div class="character-sparkle sparkle-left">✦</div>
                <div class="character-sparkle sparkle-right">✧</div>

            </div>
        </div>

        <!-- Texto principal -->
        <section class="welcome-content">

            <h1 id="mainTitle">
                ¡Hola, princesa!
            </h1>

            <p id="description">
                Soy tu amiguita gatuna y estoy muy feliz
                de verte. ¡Vamos a divertirnos juntas!
            </p>

            <button id="greetButton" type="button">
                <span class="button-icon">💖</span>
                ¡Salúdame!
                <span class="button-arrow">➜</span>
            </button>

            <div class="bottom-message">
                <span>🌸</span>
                Hecho con mucho amor
                <span>🌸</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
